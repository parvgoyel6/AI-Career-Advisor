<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Career Advisor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#06070d;
    --panel:#10131f;
    --panel-2:#151a2b;
    --line: rgba(255,255,255,0.09);
    --text:#eef1f8;
    --muted:#8890a4;
    --you: #4a7fff;
    --you-soft: rgba(74,127,255,0.14);
    --role: #ffb454;
    --role-soft: rgba(255,180,84,0.14);
    --match: #4ee1b8;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:var(--ink);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  #scene{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:1080px;
    margin:0 auto;
    padding:0 28px 120px;
  }

  /* NAV */
  nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:32px 0 0;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:-0.01em;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .logo-mark{
    width:9px; height:9px; border-radius:2px;
    background:linear-gradient(135deg, var(--you), var(--role));
    transform:rotate(45deg);
    flex-shrink:0;
  }
  nav .tag{
    color:var(--muted);
    font-size:0.85rem;
  }

  /* HERO */
  .hero{
    padding:88px 0 64px;
    max-width:620px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(2.4rem, 5.4vw, 3.6rem);
    line-height:1.05;
    letter-spacing:-0.02em;
    margin:0 0 22px;
  }
  h1 .b{ color:var(--you); }
  h1 .r{ color:var(--role); }
  .hero p{
    color:var(--muted);
    font-size:1.08rem;
    line-height:1.6;
    margin:0;
    max-width:480px;
  }

  /* UPLOAD ROW */
  .match-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:20px;
    align-items:stretch;
    margin-top:8px;
  }
  @media (max-width:720px){
    .match-row{ grid-template-columns:1fr; }
    .connector{ flex-direction:row; height:auto; padding:14px 0; }
    .connector .beam{ width:auto; height:2px; flex:1; }
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.12s ease-out, border-color 0.3s ease;
    will-change:transform;
  }
  .card.you{ border-top:2px solid var(--you); }
  .card.role{ border-top:2px solid var(--role); }
  .card.filled.you{ border-color:rgba(74,127,255,0.5); background:linear-gradient(180deg, var(--you-soft), var(--panel) 60%); }
  .card.filled.role{ border-color:rgba(255,180,84,0.5); background:linear-gradient(180deg, var(--role-soft), var(--panel) 60%); }

  .card-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.78rem;
    color:var(--muted);
    margin-bottom:16px;
  }
  .dot{ width:6px; height:6px; border-radius:50%; }
  .card.you .dot{ background:var(--you); }
  .card.role .dot{ background:var(--role); }

  .card h3{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:1.15rem;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .card .sub{
    color:var(--muted);
    font-size:0.85rem;
    margin:0 0 18px;
  }

  .drop{
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:10px;
    padding:22px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.25s ease, background 0.25s ease;
    position:relative;
  }
  .drop:hover{ border-color:rgba(255,255,255,0.35); background:rgba(255,255,255,0.02); }
  .drop input{
    position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
  }
  .drop .fname{
    font-size:0.85rem;
    color:var(--text);
    font-weight:500;
  }
  .drop .hint{
    font-size:0.78rem;
    color:var(--muted);
    margin-top:4px;
  }

  .connector{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:64px;
  }
  .beam{
    width:2px;
    flex:1;
    background:linear-gradient(180deg, var(--you), rgba(255,255,255,0.06), var(--role));
    min-height:40px;
    position:relative;
    overflow:hidden;
  }
  .beam::after{
    content:'';
    position:absolute;
    left:-4px; right:-4px;
    height:26px;
    background:linear-gradient(180deg, transparent, var(--match), transparent);
    opacity:0;
    animation:pulseBeam 2.4s ease-in-out infinite;
  }
  .match-row.ready .beam::after{ opacity:1; }
  @keyframes pulseBeam{
    0%{ top:-30px; opacity:0; }
    15%{ opacity:0.9; }
    85%{ opacity:0.9; }
    100%{ top:100%; opacity:0; }
  }

  #analyzeBtn{
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    font-size:1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.25s ease;
    flex-shrink:0;
  }
  #analyzeBtn:hover:not(:disabled){
    transform:scale(1.08);
    border-color:var(--match);
    color:var(--match);
  }
  #analyzeBtn:disabled{ opacity:0.35; cursor:not-allowed; }
  #analyzeBtn:focus-visible{ outline:2px solid var(--match); outline-offset:3px; }

  .run-label{
    text-align:center;
    margin-top:36px;
  }
  #runBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:0.95rem;
    padding:13px 30px;
    border-radius:8px;
    cursor:pointer;
    transition:all 0.25s ease;
  }
  #runBtn:hover:not(:disabled){
    border-color:var(--match);
    background:rgba(78,225,184,0.08);
  }
  #runBtn:disabled{ opacity:0.35; cursor:not-allowed; }
  #runBtn:focus-visible{ outline:2px solid var(--match); outline-offset:3px; }

  .status{
    text-align:center;
    color:var(--muted);
    font-size:0.85rem;
    margin-top:14px;
    min-height:20px;
  }
  .status.active{ color:var(--match); }

  /* RESULT */
  #result{
    display:none;
    margin-top:56px;
    background:var(--panel);
    border:1px solid var(--line);
    border-top:2px solid var(--match);
    border-radius:14px;
    padding:34px;
    transform-origin:top center;
  }
  #result.show{
    display:block;
    animation:unfold 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes unfold{
    from{ opacity:0; transform:perspective(800px) rotateX(-8deg) translateY(-10px); }
    to{ opacity:1; transform:perspective(800px) rotateX(0) translateY(0); }
  }
  #result h4{
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:0.85rem;
    color:var(--match);
    margin:0 0 18px;
    letter-spacing:0.02em;
  }
  #resultBody{
    line-height:1.7;
    color:var(--text);
    font-size:0.98rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="wrap">
  <nav>
    <div class="logo"><span class="logo-mark"></span>Career Advisor</div>
    <div class="tag">resume ↔ role fit</div>
  </nav>

  <section class="hero">
    <h1>See where <span class="b">you</span> and <span class="r">the role</span> line up.</h1>
    <p>Upload your resume and a job description. Get a clear read on the overlap, the gaps, and what to do about them.</p>
  </section>

  <form id="uploadForm">
    <div class="match-row" id="matchRow">
      <div class="card you" id="cardYou">
        <div class="card-label"><span class="dot"></span>YOU</div>
        <h3>Your resume</h3>
        <p class="sub">PDF format</p>
        <label class="drop" id="dropYou">
          <input type="file" id="resume" accept=".pdf" required>
          <div class="fname" id="fnameYou">Choose a file</div>
          <div class="hint">or drop it here</div>
        </label>
      </div>

      <div class="connector">
        <div class="beam"></div>
        <button type="submit" id="analyzeBtn" disabled aria-label="Analyze match" title="Analyze match">⇄</button>
        <div class="beam"></div>
      </div>

      <div class="card role" id="cardRole">
        <div class="card-label"><span class="dot"></span>ROLE</div>
        <h3>Job description</h3>
        <p class="sub">PDF format</p>
        <label class="drop" id="dropRole">
          <input type="file" id="jd" accept=".pdf" required>
          <div class="fname" id="fnameRole">Choose a file</div>
          <div class="hint">or drop it here</div>
        </label>
      </div>
    </div>

    <div class="run-label">
      <button type="submit" id="runBtn" disabled>Analyze match &amp; get roadmap</button>
      <div class="status" id="status"></div>
    </div>
  </form>

  <div id="result">
    <h4>MATCH REPORT</h4>
    <div id="resultBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  /* ---------------- 3D background scene ---------------- */
  (function(){
    const canvas = document.getElementById('scene');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 13);

    const group = new THREE.Group();
    scene.add(group);

    // two anchor nodes: "you" (blue) and "role" (amber), plus a field of connecting particles
    const youColor = new THREE.Color(0x4a7fff);
    const roleColor = new THREE.Color(0xffb454);

    const youGeo = new THREE.IcosahedronGeometry(1.1, 0);
    const youMat = new THREE.MeshBasicMaterial({ color: youColor, wireframe:true, transparent:true, opacity:0.55 });
    const youMesh = new THREE.Mesh(youGeo, youMat);
    youMesh.position.set(-4.2, 1.4, -2);
    group.add(youMesh);

    const roleGeo = new THREE.IcosahedronGeometry(1.35, 0);
    const roleMat = new THREE.MeshBasicMaterial({ color: roleColor, wireframe:true, transparent:true, opacity:0.5 });
    const roleMesh = new THREE.Mesh(roleGeo, roleMat);
    roleMesh.position.set(4.6, -1.6, -4);
    group.add(roleMesh);

    // particle field between them
    const count = window.innerWidth < 720 ? 90 : 220;
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const tmp = new THREE.Color();
    for(let i=0;i<count;i++){
      const t = Math.random();
      positions[i*3]   = THREE.MathUtils.lerp(-7, 7, Math.random());
      positions[i*3+1] = THREE.MathUtils.lerp(-4, 4, Math.random());
      positions[i*3+2] = THREE.MathUtils.lerp(-8, 2, Math.random());
      tmp.copy(youColor).lerp(roleColor, (positions[i*3]+7)/14);
      colors[i*3] = tmp.r; colors[i*3+1] = tmp.g; colors[i*3+2] = tmp.b;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const pMat = new THREE.PointsMaterial({ size:0.045, vertexColors:true, transparent:true, opacity:0.65 });
    const points = new THREE.Points(pGeo, pMat);
    group.add(points);

    let mx = 0, my = 0;
    window.addEventListener('pointermove', (e)=>{
      mx = (e.clientX / window.innerWidth - 0.5);
      my = (e.clientY / window.innerHeight - 0.5);
    });

    function resize(){
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);

    const clock = new THREE.Clock();
    function tick(){
      const t = clock.getElapsedTime();
      youMesh.rotation.x = t*0.08; youMesh.rotation.y = t*0.12;
      roleMesh.rotation.x = -t*0.06; roleMesh.rotation.y = t*0.09;
      points.rotation.y = t*0.015;

      group.rotation.y += (mx*0.4 - group.rotation.y) * 0.02;
      group.rotation.x += (-my*0.25 - group.rotation.x) * 0.02;

      renderer.render(scene, camera);
      if(!reduceMotion) requestAnimationFrame(tick);
    }
    tick();
    if(reduceMotion) renderer.render(scene, camera);
  })();

  /* ---------------- card tilt interaction ---------------- */
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('pointermove', (e)=>{
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - 0.5;
      const py = (e.clientY - r.top) / r.height - 0.5;
      card.style.transform = `perspective(700px) rotateY(${px*6}deg) rotateX(${-py*6}deg)`;
    });
    card.addEventListener('pointerleave', ()=>{
      card.style.transform = 'perspective(700px) rotateY(0) rotateX(0)';
    });
  });

  /* ---------------- form logic ---------------- */
  const resumeInput = document.getElementById('resume');
  const jdInput = document.getElementById('jd');
  const fnameYou = document.getElementById('fnameYou');
  const fnameRole = document.getElementById('fnameRole');
  const cardYou = document.getElementById('cardYou');
  const cardRole = document.getElementById('cardRole');
  const matchRow = document.getElementById('matchRow');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const runBtn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const resultBody = document.getElementById('resultBody');

  function refreshState(){
    const hasResume = resumeInput.files.length > 0;
    const hasJd = jdInput.files.length > 0;
    fnameYou.textContent = hasResume ? resumeInput.files[0].name : 'Choose a file';
    fnameRole.textContent = hasJd ? jdInput.files[0].name : 'Choose a file';
    cardYou.classList.toggle('filled', hasResume);
    cardRole.classList.toggle('filled', hasJd);
    const ready = hasResume && hasJd;
    matchRow.classList.toggle('ready', ready);
    analyzeBtn.disabled = !ready;
    runBtn.disabled = !ready;
  }
  resumeInput.addEventListener('change', refreshState);
  jdInput.addEventListener('change', refreshState);

  document.getElementById('uploadForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    if(analyzeBtn.disabled) return;

    status.textContent = 'Analyzing documents…';
    status.classList.add('active');
    result.classList.remove('show');
    analyzeBtn.disabled = true;
    runBtn.disabled = true;

    const formData = new FormData();
    formData.append('resume', resumeInput.files[0]);
    formData.append('job_description', jdInput.files[0]);

    try{
      const response = await fetch('http://127.0.0.1:8000/analyze', {
        method:'POST',
        body: formData
      });
      const data = await response.json();

      status.textContent = 'Done';
      resultBody.innerHTML = data.analysis.replace(/\n/g, '<br>');
      result.classList.add('show');
      result.scrollIntoView({ behavior:'smooth', block:'start' });
    }catch(err){
      status.textContent = 'Could not reach the server — make sure your Python backend is running.';
    }finally{
      analyzeBtn.disabled = false;
      runBtn.disabled = false;
    }
  });
</script>
</body>
</html>
